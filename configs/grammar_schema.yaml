# ------------------------------------------------------------------------------
# 3. DANH MỤC SÊ-RI NGOẠI GIAO & TỔ CHỨC QUỐC TẾ (DIPLOMATIC & INT CODES)
# ------------------------------------------------------------------------------
diplomatic_series:
  "NG": "Đại sứ quán, Cơ quan lãnh sự, Viên chức ngoại giao"
  "QT": "Cơ quan đại diện Tổ chức Quốc tế và Viên chức quốc tế"
  "NN": "Tổ chức, văn phòng đại diện, cá nhân người nước ngoài"
  "CV": "Nhân viên hành chính kỹ thuật của cơ quan ngoại giao"

# ------------------------------------------------------------------------------
# 4. DANH MỤC SÊ-RI CHUYÊN DỤNG VÀ ĐẶC BIỆT DÂN SỰ
# ------------------------------------------------------------------------------
special_civilian_series:
  "LD": "Xe của các doanh nghiệp có vốn đầu tư nước ngoài (Liên doanh)"
  "DA": "Xe của các Ban quản lý dự án do nước ngoài đầu tư"
  "R":  "Rơ-moóc / Sơ-mi rơ-moóc"
  "RM": "Rơ-moóc / Sơ-mi rơ-moóc (ký hiệu mở rộng)"
  "MK": "Máy kéo, xe máy chuyên dùng"
