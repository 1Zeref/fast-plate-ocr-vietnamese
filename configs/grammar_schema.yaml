  "MD": "Xe máy điện (chuẩn hóa ASCII)"
  "CD": "Xe 4 bánh chở người gắn động cơ / Xe điện du lịch"
  "HC": "Xe hoạt động trong phạm vi hạn chế (sân bay, cảng biển)"
  "T":  "Xe đăng ký tạm thời"

# ------------------------------------------------------------------------------
# 5. KHÔNG GIAN TRẠNG THÁI HỮU HẠN & BIỂU THỨC QUY TẮC (REGULAR GRAMMAR)
# ------------------------------------------------------------------------------
grammar_rules:
  # Ký hiệu cơ bản:
  # P  : Mã tỉnh (2 chữ số hợp lệ từ valid_province_codes)
  # C  : Chữ cái dân sự tiêu chuẩn (A,B,C,D,E,F,G,H,K,L,M,N,P,S,T,U,V,X,Y,Z)
  # M  : Mã đơn vị quân sự (2 chữ cái từ military_unit_codes)
  # D  : Sê-ri ngoại giao (NG, QT, NN, CV)
  # N  : Chữ số tự nhiên (0-9)
  # S  : Dấu phân cách hiển thị tùy chọn: '-', '.', ' ' hoặc ''

  patterns:
    # 5.1 BIỂN Ô TÔ DÂN SỰ & CƠ QUAN NHÀ NƯỚC (5 SỐ & 4 SỐ)
    civilian_car_5_digits:
      description: "Ô tô 5 số (TT 24/2023 & TT 58/2020) - 1 chữ cái hoặc 2 chữ cái"
      single_line_regex: "^(?P<province>[1-9][0-9])(?P<series>[A-Z]{1,2})(?P<sub_series>[0-9]?)[- ]?(?P<num>[0-9]{3})[.]?(?P<tail>[0-9]{2})$"
      double_line_regex:
        line1: "^(?P<province>[1-9][0-9])[- ]?(?P<series>[A-Z]{1,2})(?P<sub_series>[0-9]?)$"
        line2: "^(?P<num>[0-9]{3})[.]?(?P<tail>[0-9]{2})$"
      normalized_pattern: "PP C{1,2} [0-9]{5}"
      example: "30A12345, 51K99999, 29AA12345"

    civilian_car_4_digits:
      description: "Ô tô 4 số cũ đang lưu hành"
      single_line_regex: "^(?P<province>[1-9][0-9])(?P<series>[A-Z]{1,2})[- ]?(?P<num>[0-9]{4})$"
      double_line_regex:
        line1: "^(?P<province>[1-9][0-9])[- ]?(?P<series>[A-Z]{1,2})$"
        line2: "^(?P<num>[0-9]{4})$"
      normalized_pattern: "PP C{1,2} [0-9]{4}"
      example: "29S1234, 30H5678"

    # 5.2 BIỂN XE CHUYÊN DỤNG (RƠ-MOÓC, MÁY KÉO, LIÊN DOANH, DỰ ÁN)
    special_vehicle_car:
      description: "Xe rơ-moóc, liên doanh, dự án, máy kéo"
      single_line_regex: "^(?P<province>[1-9][0-9])(?P<series>LD|DA|MK|RM|R|CD|HC)[- ]?(?P<num>[0-9]{3,5})$"
      double_line_regex:
        line1: "^(?P<province>[1-9][0-9])[- ]?(?P<series>LD|DA|MK|RM|R|CD|HC)$"
        line2: "^(?P<num>[0-9]{3,5})$"
      normalized_pattern: "PP (LD|DA|MK|RM|R|CD|HC) [0-9]{4,5}"
      example: "29LD12345, 51R12345, 34MK1234"

    # 5.3 BIỂN XE MÁY / MÔ TÔ (2 DÒNG HOẶC 1 DÒNG CHUẨN HÓA)
    motorcycle_5_digits:
      description: "Xe máy 5 số: Sê-ri 2 chữ cái (TT 24) hoặc 1 chữ cái + 1 số (TT 58)"
      single_line_regex: "^(?P<province>[1-9][0-9])(?P<series>[A-Z]{1,2})(?P<sub_id>[0-9]?)[- ]?(?P<num>[0-9]{3})[.]?(?P<tail>[0-9]{2})$"
      double_line_regex:
        line1: "^(?P<province>[1-9][0-9])[- ]?(?P<series>[A-Z]{1,2})(?P<sub_id>[0-9]?)$"
        line2: "^(?P<num>[0-9]{3})[.]?(?P<tail>[0-9]{2})$"
      normalized_pattern: "PP (C[0-9]|CC|MD[0-9]) [0-9]{5}"
      example: "29B112345, 59AA67890, 29MD12345"

    motorcycle_4_digits:
      description: "Xe máy 4 số cũ"
      single_line_regex: "^(?P<province>[1-9][0-9])(?P<series>[A-Z]{1,2})(?P<sub_id>[0-9]?)[- ]?(?P<num>[0-9]{4})$"
      double_line_regex:
        line1: "^(?P<province>[1-9][0-9])[- ]?(?P<series>[A-Z]{1,2})(?P<sub_id>[0-9]?)$"
        line2: "^(?P<num>[0-9]{4})$"
      normalized_pattern: "PP (C[0-9]|CC) [0-9]{4}"
      example: "29H41234, 52F25678"

    # 5.4 BIỂN SỐ XE QUÂN SỰ
    military_vehicle:
      description: "Xe quân đội biển đỏ: 2 chữ cái đơn vị + 4 hoặc 5 chữ số"
      single_line_regex: "^(?P<unit>[A-Z]{2})[- ]?(?P<num1>[0-9]{2})[- ]?(?P<num2>[0-9]{2,3})$"
      double_line_regex:
        line1: "^(?P<unit>[A-Z]{2})$"
        line2: "^(?P<num>[0-9]{4,5})$"
      normalized_pattern: "MM [0-9]{4,5}"
      example: "TM1234, QA5678, VT12345"

    # 5.5 BIỂN SỐ NGOẠI GIAO & TỔ CHỨC QUỐC TẾ
    diplomatic_vehicle:
      description: "Biển NG, QT, NN, CV: Mã tỉnh + Sê-ri + Mã quốc gia/tổ chức (3 số) + Số thứ tự (2 số)"
      single_line_regex: "^(?P<province>[1-9][0-9])(?P<series>NG|QT|NN|CV)[- ]?(?P<country>[0-9]{3})[- ]?(?P<order>[0-9]{2})$"
      double_line_regex:
        line1: "^(?P<province>[1-9][0-9])[- ]?(?P<series>NG|QT|NN|CV)$"
        line2: "^(?P<country>[0-9]{3})[- ]?(?P<order>[0-9]{2})$"
      normalized_pattern: "PP (NG|QT|NN|CV) [0-9]{3} [0-9]{2}"
      example: "80NG16601, 29QT00102, 51NN12345"

# ------------------------------------------------------------------------------
# 6. MÁY TRẠNG THÁI HỮU HẠN (DFA TRANSITION GRAPH)
# ------------------------------------------------------------------------------
# Định nghĩa các trạng thái (States) và chuyển dịch (Transitions) cho chuỗi OCR chuẩn hóa
dfa_state_machine:
  start_state: "S_START"
  accept_states:
    - "S_ACCEPT_5D"
    - "S_ACCEPT_4D"
    - "S_ACCEPT_DIPLO"
    - "S_ACCEPT_MILITARY"

  states:
    S_START:
      description: "Điểm khởi đầu nhận dạng chuỗi"
      transitions:
        - input_category: "PROVINCE_FIRST_DIGIT (1-9)"
          next_state: "S_PROV_D1"
          note: "Nhánh biển dân sự, cơ quan hoặc ngoại giao"
        - input_category: "MILITARY_FIRST_LETTER (A,B,C,H,K,P,Q,T,V)"
          next_state: "S_MIL_L1"
          note: "Nhánh biển quân sự"

    S_PROV_D1:
      description: "Chữ số đầu tiên của mã tỉnh"
      transitions:
        - input_category: "PROVINCE_SECOND_DIGIT (0-9)"
          next_state: "S_PROV_D2"
          constraint: "Ghép lại phải thuộc bảng valid_province_codes"

    S_PROV_D2:
      description: "Đã xác định mã tỉnh hợp lệ"
      transitions:
        - input_category: "CIVILIAN_SERIES_LETTER (A-Z trừ I,J,O,W,Q)"
          next_state: "S_CIV_SERIES_1"
        - input_category: "SPECIAL_SERIES_LETTER ('R')"
          next_state: "S_SPEC_R"
        - input_category: "DIPLOMATIC_SERIES_N ('N')"
          next_state: "S_DIPLO_N"
        - input_category: "DIPLOMATIC_SERIES_Q ('Q')"
          next_state: "S_DIPLO_Q"
        - input_category: "DIPLOMATIC_SERIES_C ('C')"
          next_state: "S_DIPLO_C"

    # Nhánh ô tô & xe máy dân sự:
    S_CIV_SERIES_1:
      description: "Chữ cái đầu tiên của sê-ri dân sự"
      transitions:
        - input_category: "SECOND_SERIES_LETTER (A-Z dân sự)"
          next_state: "S_CIV_SERIES_2"
        - input_category: "SUB_SERIES_DIGIT (0-9: xe máy/tải)"
          next_state: "S_CIV_SERIES_NUM"
        - input_category: "NUMBER_FIRST_DIGIT (0-9)"
          next_state: "S_NUM_1"

    S_CIV_SERIES_2:
      description: "Sê-ri 2 chữ cái (ô tô TT24 hoặc xe máy)"
      transitions:
        - input_category: "NUMBER_FIRST_DIGIT (0-9)"
          next_state: "S_NUM_1"

    S_CIV_SERIES_NUM:
      description: "Sê-ri 1 chữ cái + 1 số (ví dụ 29-B1)"
      transitions:
        - input_category: "NUMBER_FIRST_DIGIT (0-9)"
          next_state: "S_NUM_1"

    S_SPEC_R:
      description: "Biển rơ-moóc chữ R hoặc RM"
      transitions:
        - input_category: "CHAR 'M'"
          next_state: "S_SPEC_RM"
        - input_category: "NUMBER_FIRST_DIGIT (0-9)"
          next_state: "S_NUM_1"

    S_SPEC_RM:
      transitions:
        - input_category: "NUMBER_FIRST_DIGIT (0-9)"
          next_state: "S_NUM_1"

    # Nhánh số thứ tự (0-9):
    S_NUM_1:
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_NUM_2" }]
    S_NUM_2:
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_NUM_3" }]
    S_NUM_3:
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_NUM_4" }]
    S_NUM_4:
      transitions:
        - input_category: "DIGIT (0-9)"
          next_state: "S_NUM_5"
        - input_category: "END_OF_STRING / PAD"
          next_state: "S_ACCEPT_4D"
    S_NUM_5:
      transitions:
        - input_category: "END_OF_STRING / PAD"
          next_state: "S_ACCEPT_5D"

    # Nhánh Ngoại giao (NG, QT, NN, CV):
    S_DIPLO_N:
      transitions:
        - input_category: "CHAR 'G'"
          next_state: "S_DIPLO_CODE"
        - input_category: "CHAR 'N'"
          next_state: "S_DIPLO_CODE"
    S_DIPLO_Q:
      transitions:
        - input_category: "CHAR 'T'"
          next_state: "S_DIPLO_CODE"
    S_DIPLO_C:
      transitions:
        - input_category: "CHAR 'V'"
          next_state: "S_DIPLO_CODE"
        - input_category: "CHAR 'D'"
          next_state: "S_CIV_SERIES_2"
    S_DIPLO_CODE:
      description: "Bắt đầu 3 số mã quốc gia"
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_DIP_C1" }]
    S_DIP_C1:
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_DIP_C2" }]
    S_DIP_C2:
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_DIP_C3" }]
    S_DIP_C3:
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_DIP_O1" }]
    S_DIP_O1:
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_DIP_O2" }]
    S_DIP_O2:
      transitions:
        - input_category: "END_OF_STRING / PAD"
          next_state: "S_ACCEPT_DIPLO"

    # Nhánh Quân đội:
    S_MIL_L1:
      description: "Chữ cái đầu tiên đơn vị quân sự"
      transitions:
        - input_category: "MILITARY_SECOND_LETTER"
          next_state: "S_MIL_L2"
          constraint: "Cặp chữ cái phải thuộc bảng military_unit_codes"
    S_MIL_L2:
      transitions:
        - input_category: "DIGIT (0-9)"
          next_state: "S_MIL_N1"
    S_MIL_N1:
      transitions: [{ input_category: "DIGIT (0-9)", next_state: "S_MIL_N2" }]
    S_MIL_N2:
